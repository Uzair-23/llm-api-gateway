version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: llm-gateway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mongo:
    image: mongo:7
    container_name: llm-gateway-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  gateway-1:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: llm-gateway-1
    env_file:
      - gateway/.env
    environment:
      - INSTANCE_ID=gateway-1
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/llm-gateway
      - REDIS_URL=redis://redis:6379
    expose:
      - "4000"
    depends_on:
      - mongo
      - redis

  gateway-2:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: llm-gateway-2
    env_file:
      - gateway/.env
    environment:
      - INSTANCE_ID=gateway-2
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/llm-gateway
      - REDIS_URL=redis://redis:6379
    expose:
      - "4000"
    depends_on:
      - mongo
      - redis

  gateway-3:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    container_name: llm-gateway-3
    env_file:
      - gateway/.env
    environment:
      - INSTANCE_ID=gateway-3
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/llm-gateway
      - REDIS_URL=redis://redis:6379
    expose:
      - "4000"
    depends_on:
      - mongo
      - redis

  nginx:
    image: nginx:alpine
    container_name: llm-gateway-nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3

volumes:
  redis-data:
  mongo-data: